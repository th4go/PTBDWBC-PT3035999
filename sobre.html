<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFSP - Sobre</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            font-family: Georgia, serif;
        }

        .container {
            width: 100%;
        }

        /* HEADER */
        .navbar {
            background: #333;
        }

        .menu {
            list-style: none;
            display: flex;
        }

        .menu li a {
            display: block;
            padding: 18px 28px;
            color: white;
            text-decoration: none;
            transition: 0.3s;
        }

        .menu li a:hover {
            background: red;
        }

        .menu .active {
            background: red;
            margin-left: auto;
        }

        /* BANNER */
        .banner {
            background: green;
            height: 100px;
            display: flex;
            align-items: center;
        }

        .logo {
            width: 300px;
            height: 100px;
            background: linear-gradient(to right, #009933, #008000);
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logo img {
            height: 100px;
        }

        .logo-texto h2 {
            font-size: 18px;
        }

        .logo-texto p {
            font-size: 14px;
        }

        .conteudo {
            padding: 20px 10px;
            line-height: 1.5;
        }

        .conteudo p {
            margin-bottom: 18px;
        }

        .facebook img {
            width: 45px;
            height: 45px;
        }
        .footer {
            padding: 10px;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        function Header() {
            return (
                <>
                    <nav className="navbar">
                        <ul className="menu">
                            <li><a href="../index.html">HOME</a></li>
                            <li><a href="../eventos.html">EVENTOS</a></li>
                            <li><a href="../contato.html">CONTATO</a></li>
                            <li><a href="../pages-cursos/ads.html">CURSOS</a></li>
                            <li><a href="../login.html">ENTRAR</a></li>
                            <li ><a href="../sobre.html">SOBRE</a></li>
                        </ul>
                    </nav>

                    <div className="banner">
                        <div className="logo">
                            <img src="https://github.com/DWBA4/dwba4_semana_imagens/blob/master/Logo.jpg?raw=true" alt=""/>
                        </div>
                    </div>
                </>
            );
        }

        function Main() {
            return (
                <main className="conteudo">

                    <p>
                        <strong>
                            O Instituto Federal de Educação, Ciência e Tecnologia de São Paulo
                        </strong> – é uma autarquia federal de ensino.
                    </p>

                    <p>
                        Fundada em 1909, como Escola de Aprendizes Artífices, é reconhecida pela
                        sociedade paulista por sua excelência no ensino público gratuito de qualidade.
                    </p>

                    <p>
                        Durante sua história, recebeu, também, os nomes de Escola Técnica Federal
                        de São Paulo e Centro Federal de Educação Tecnológica de São Paulo.
                        Com a transformação em Instituto, em dezembro de 2008, passou a ter
                        relevância de universidade, destacando-se pela autonomia.
                    </p>

                    <p>
                        Com a mudança, o Instituto Federal de São Paulo passou a destinar 50%
                        das vagas para os cursos técnicos e, no mínimo, 20% das vagas para
                        os cursos de licenciatura, sobretudo nas áreas de Ciências e Matemática.
                        Complementarmente, continuará oferecendo cursos de formação inicial e
                        continuada, tecnologias, engenharias e pós-graduação.
                    </p>

                    <p>
                        Além dos cursos presenciais, o Instituto Federal de São Paulo oferece os
                        cursos Técnicos em Administração e em Informática para Internet e,
                        a partir de 2012, o superior de Formação de Professores na modalidade
                        de Ensino a Distância (EaD).
                    </p>

                    <p>
                        O IFSP é organizado em diversos câmpus e possui mais de 40 mil alunos
                        matriculados nas 36 unidades distribuídas pelo estado de São Paulo.
                    </p>

                    <p>
                        Localizado em
                        <strong>
                            {" "}Rua Pedro Vicente, 625 - Canindé - São Paulo - SP - Brasil - Cep: 01109-010
                        </strong>
                    </p>

                </main>
            );
        }

        function Footer() {
            return (
                <>
                    <div className="facebook">
                        <img src="https://github.com/DWBA4/dwba4_semana_imagens/blob/master/facebook.png?raw=true" alt="Facebook"/>
                    </div>

                    <footer className="footer">
                        IFSP - Câmpus Pirituba - Av. Mutinga, 951 - Jardim Santo Elias -
                        CEP: 05110-000 - São Paulo/SP - Contato: (011) 2504-0100
                    </footer>
                </>
            );
        }

        function App() {
            return (
                <div className="container">
                    <Header />
                    <Main />
                    <Footer />
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>

</body>

</html>
